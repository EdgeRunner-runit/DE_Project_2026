<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="crow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 12 6 L 0 11 M 12 1 L 12 11" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
    <style>
      .tbl-hdr { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .tbl-col { font-size: 12px; fill: #e2e8f0; }
      .tbl-key { font-size: 10px; font-weight: bold; fill: #fbbf24; }
      .tbl-type { font-size: 11px; fill: #94a3b8; }
      .rel-line { stroke: #475569; stroke-width: 2; fill: none; }
      .rel-line-hi { stroke: #38bdf8; stroke-width: 2.2; fill: none; stroke-dasharray: 4,2; }
    </style>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1520" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="55" fill="#38bdf8" font-size="20" font-weight="bold">BookMyShow Enterprise Ticketing Engine — Entity-Relationship Architecture (3NF/BCNF)</text>
  <text x="1300" y="55" fill="#94a3b8" font-size="14">Team T0132 · PostgreSQL 16+</text>

  <!-- TABLE HELPER MACROS -->
  <!-- Cities: (50, 110) -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="200" height="125" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="200" height="32" rx="6" fill="#1d4ed8"/>
    <text x="15" y="22" class="tbl-hdr">cities</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">city_id</text><text x="140" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">UK</text><text x="38" y="78" class="tbl-col">city_name</text><text x="140" y="78" class="tbl-type">VARCHAR</text>
    <text x="38" y="101" class="tbl-col">state</text><text x="140" y="101" class="tbl-type">VARCHAR</text>
  </g>

  <!-- Venues: (310, 110) -->
  <g transform="translate(310, 110)" filter="url(#shadow)">
    <rect width="220" height="170" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#1d4ed8"/>
    <text x="15" y="22" class="tbl-hdr">venues</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">venue_id</text><text x="150" y="55" class="tbl-type">INT</text>
    <text x="38" y="78" class="tbl-col">venue_name</text><text x="150" y="78" class="tbl-type">VARCHAR</text>
    <text x="15" y="101" class="tbl-key">FK</text><text x="38" y="101" class="tbl-col">city_id</text><text x="150" y="101" class="tbl-type">INT</text>
    <text x="38" y="124" class="tbl-col">chain</text><text x="150" y="124" class="tbl-type">VARCHAR</text>
    <text x="38" y="147" class="tbl-col">address</text><text x="150" y="147" class="tbl-type">TEXT</text>
  </g>

  <!-- Screens: (590, 110) -->
  <g transform="translate(590, 110)" filter="url(#shadow)">
    <rect width="220" height="170" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#1d4ed8"/>
    <text x="15" y="22" class="tbl-hdr">screens</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">screen_id</text><text x="150" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">FK</text><text x="38" y="78" class="tbl-col">venue_id</text><text x="150" y="78" class="tbl-type">INT</text>
    <text x="38" y="101" class="tbl-col">screen_name</text><text x="150" y="101" class="tbl-type">VARCHAR</text>
    <text x="38" y="124" class="tbl-col">screen_type</text><text x="150" y="124" class="tbl-type">VARCHAR</text>
    <text x="38" y="147" class="tbl-col">total_seats (der.)</text><text x="150" y="147" class="tbl-type">INT</text>
  </g>

  <!-- Seats: (870, 110) -->
  <g transform="translate(870, 110)" filter="url(#shadow)">
    <rect width="220" height="170" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#1d4ed8"/>
    <text x="15" y="22" class="tbl-hdr">seats</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">seat_id</text><text x="150" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">FK</text><text x="38" y="78" class="tbl-col">screen_id</text><text x="150" y="78" class="tbl-type">INT</text>
    <text x="38" y="101" class="tbl-col">row_label</text><text x="150" y="101" class="tbl-type">VARCHAR</text>
    <text x="38" y="124" class="tbl-col">seat_number</text><text x="150" y="124" class="tbl-type">INT</text>
    <text x="38" y="147" class="tbl-col">seat_class</text><text x="150" y="147" class="tbl-type">VARCHAR</text>
  </g>

  <!-- Movies: (310, 390) -->
  <g transform="translate(310, 390)" filter="url(#shadow)">
    <rect width="220" height="195" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#0891b2"/>
    <text x="15" y="22" class="tbl-hdr">movies</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">movie_id</text><text x="150" y="55" class="tbl-type">INT</text>
    <text x="38" y="78" class="tbl-col">title</text><text x="150" y="78" class="tbl-type">VARCHAR</text>
    <text x="38" y="101" class="tbl-col">language</text><text x="150" y="101" class="tbl-type">VARCHAR</text>
    <text x="38" y="124" class="tbl-col">certificate</text><text x="150" y="124" class="tbl-type">VARCHAR</text>
    <text x="38" y="147" class="tbl-col">duration_min</text><text x="150" y="147" class="tbl-type">SMALLINT</text>
    <text x="38" y="170" class="tbl-col">release_date</text><text x="150" y="170" class="tbl-type">DATE</text>
  </g>

  <!-- Shows: (590, 370) -->
  <g transform="translate(590, 370)" filter="url(#shadow)">
    <rect width="230" height="220" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="230" height="32" rx="6" fill="#0891b2"/>
    <text x="15" y="22" class="tbl-hdr">shows</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">show_id</text><text x="150" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">FK</text><text x="38" y="78" class="tbl-col">movie_id</text><text x="150" y="78" class="tbl-type">INT</text>
    <text x="15" y="101" class="tbl-key">FK</text><text x="38" y="101" class="tbl-col">screen_id</text><text x="150" y="101" class="tbl-type">INT</text>
    <text x="38" y="124" class="tbl-col">starts_at</text><text x="150" y="124" class="tbl-type">TIMESTAMPTZ</text>
    <text x="38" y="147" class="tbl-col">ends_at</text><text x="150" y="147" class="tbl-type">TIMESTAMPTZ</text>
    <text x="38" y="170" class="tbl-col">format</text><text x="150" y="170" class="tbl-type">VARCHAR</text>
    <text x="38" y="193" class="tbl-col">base_price</text><text x="150" y="193" class="tbl-type">NUMERIC</text>
  </g>

  <!-- Customers: (50, 680) -->
  <g transform="translate(50, 680)" filter="url(#shadow)">
    <rect width="220" height="195" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#7c3aed"/>
    <text x="15" y="22" class="tbl-hdr">customers</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">customer_id</text><text x="150" y="55" class="tbl-type">INT</text>
    <text x="38" y="78" class="tbl-col">full_name</text><text x="150" y="78" class="tbl-type">VARCHAR</text>
    <text x="15" y="101" class="tbl-key">UK</text><text x="38" y="101" class="tbl-col">email</text><text x="150" y="101" class="tbl-type">VARCHAR</text>
    <text x="15" y="124" class="tbl-key">UK</text><text x="38" y="124" class="tbl-col">phone</text><text x="150" y="124" class="tbl-type">VARCHAR</text>
    <text x="15" y="147" class="tbl-key">FK</text><text x="38" y="147" class="tbl-col">city_id</text><text x="150" y="147" class="tbl-type">INT</text>
    <text x="38" y="170" class="tbl-col">created_at</text><text x="150" y="170" class="tbl-type">TIMESTAMPTZ</text>
  </g>

  <!-- Offers: (350, 930) -->
  <g transform="translate(350, 930)" filter="url(#shadow)">
    <rect width="240" height="195" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#059669"/>
    <text x="15" y="22" class="tbl-hdr">offers</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">offer_code</text><text x="165" y="55" class="tbl-type">VARCHAR</text>
    <text x="38" y="78" class="tbl-col">description</text><text x="165" y="78" class="tbl-type">TEXT</text>
    <text x="38" y="101" class="tbl-col">discount_pct</text><text x="165" y="101" class="tbl-type">NUMERIC</text>
    <text x="38" y="124" class="tbl-col">max_discount</text><text x="165" y="124" class="tbl-type">NUMERIC</text>
    <text x="38" y="147" class="tbl-col">valid_from</text><text x="165" y="147" class="tbl-type">DATE</text>
    <text x="38" y="170" class="tbl-col">valid_to</text><text x="165" y="170" class="tbl-type">DATE</text>
  </g>

  <!-- Bookings: (680, 680) -->
  <g transform="translate(680, 680)" filter="url(#shadow)">
    <rect width="280" height="380" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="280" height="32" rx="6" fill="#d97706"/>
    <text x="15" y="22" class="tbl-hdr">bookings</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">booking_id</text><text x="190" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">UK</text><text x="38" y="78" class="tbl-col">booking_code</text><text x="190" y="78" class="tbl-type">VARCHAR</text>
    <text x="15" y="101" class="tbl-key">FK</text><text x="38" y="101" class="tbl-col">customer_id</text><text x="190" y="101" class="tbl-type">INT</text>
    <text x="15" y="124" class="tbl-key">FK</text><text x="38" y="124" class="tbl-col">show_id</text><text x="190" y="124" class="tbl-type">INT</text>
    <text x="38" y="147" class="tbl-col">booked_at</text><text x="190" y="147" class="tbl-type">TIMESTAMPTZ</text>
    <text x="38" y="170" class="tbl-col">num_tickets</text><text x="190" y="170" class="tbl-type">SMALLINT</text>
    <text x="38" y="193" class="tbl-col">ticket_amount</text><text x="190" y="193" class="tbl-type">NUMERIC</text>
    <text x="38" y="216" class="tbl-col">convenience_fee</text><text x="190" y="216" class="tbl-type">NUMERIC</text>
    <text x="38" y="239" class="tbl-col">fnb_amount</text><text x="190" y="239" class="tbl-type">NUMERIC</text>
    <text x="15" y="262" class="tbl-key">FK</text><text x="38" y="262" class="tbl-col">offer_code (null)</text><text x="190" y="262" class="tbl-type">VARCHAR</text>
    <text x="38" y="285" class="tbl-col">discount</text><text x="190" y="285" class="tbl-type">NUMERIC</text>
    <text x="38" y="308" class="tbl-col">total_amount</text><text x="190" y="308" class="tbl-type">NUMERIC</text>
    <text x="38" y="331" class="tbl-col">payment_method</text><text x="190" y="331" class="tbl-type">VARCHAR</text>
    <text x="38" y="354" class="tbl-col">status</text><text x="190" y="354" class="tbl-type">VARCHAR</text>
  </g>

  <!-- Booking Seats: (1080, 520) -->
  <g transform="translate(1080, 520)" filter="url(#shadow)">
    <rect width="240" height="170" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="240" height="32" rx="6" fill="#db2777"/>
    <text x="15" y="22" class="tbl-hdr">booking_seats</text>
    <text x="15" y="55" class="tbl-key">FK</text><text x="38" y="55" class="tbl-col">booking_id</text><text x="165" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">PK,FK</text><text x="52" y="78" class="tbl-col">show_id</text><text x="165" y="78" class="tbl-type">INT</text>
    <text x="15" y="101" class="tbl-key">PK,FK</text><text x="52" y="101" class="tbl-col">seat_id</text><text x="165" y="101" class="tbl-type">INT</text>
    <text x="38" y="124" class="tbl-col">price</text><text x="165" y="124" class="tbl-type">NUMERIC</text>
    <text x="15" y="150" font-size="10" fill="#cbd5e1">Atomic: 1 seat/show lock</text>
  </g>

  <!-- Movie Reviews: (50, 410) -->
  <g transform="translate(50, 410)" filter="url(#shadow)">
    <rect width="210" height="195" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="210" height="32" rx="6" fill="#9333ea"/>
    <text x="15" y="22" class="tbl-hdr">movie_reviews</text>
    <text x="15" y="55" class="tbl-key">PK</text><text x="38" y="55" class="tbl-col">review_id</text><text x="140" y="55" class="tbl-type">INT</text>
    <text x="15" y="78" class="tbl-key">FK</text><text x="38" y="78" class="tbl-col">movie_id</text><text x="140" y="78" class="tbl-type">INT</text>
    <text x="15" y="101" class="tbl-key">FK</text><text x="38" y="101" class="tbl-col">customer_id</text><text x="140" y="101" class="tbl-type">INT</text>
    <text x="38" y="124" class="tbl-col">rating</text><text x="140" y="124" class="tbl-type">SMALLINT</text>
    <text x="38" y="147" class="tbl-col">review_text (null)</text><text x="140" y="147" class="tbl-type">TEXT</text>
    <text x="38" y="170" class="tbl-col">created_at</text><text x="140" y="170" class="tbl-type">TIMESTAMPTZ</text>
  </g>

  <!-- RELATIONSHIP PATHS -->
  <!-- cities -> venues -->
  <path d="M 250 170 L 310 170" class="rel-line" marker-end="url(#crow)"/>
  <!-- venues -> screens -->
  <path d="M 530 170 L 590 170" class="rel-line" marker-end="url(#crow)"/>
  <!-- screens -> seats -->
  <path d="M 810 170 L 870 170" class="rel-line" marker-end="url(#crow)"/>
  <!-- screens -> shows -->
  <path d="M 700 280 L 700 370" class="rel-line" marker-end="url(#crow)"/>
  <!-- movies -> shows -->
  <path d="M 530 480 L 590 480" class="rel-line" marker-end="url(#crow)"/>
  <!-- cities -> customers -->
  <path d="M 140 235 L 140 680" class="rel-line" marker-end="url(#crow)"/>
  <!-- customers -> bookings -->
  <path d="M 270 770 L 680 770" class="rel-line" marker-end="url(#crow)"/>
  <!-- shows -> bookings -->
  <path d="M 720 590 L 720 680" class="rel-line" marker-end="url(#crow)"/>
  <!-- offers -> bookings -->
  <path d="M 590 990 L 680 990" class="rel-line-hi" marker-end="url(#crow)"/>
  <!-- bookings -> booking_seats -->
  <path d="M 960 740 L 1080 620" class="rel-line" marker-end="url(#crow)"/>
  <!-- shows -> booking_seats -->
  <path d="M 820 480 L 1080 570" class="rel-line" marker-end="url(#crow)"/>
  <!-- seats -> booking_seats -->
  <path d="M 980 280 L 1150 280 L 1150 520" class="rel-line" marker-end="url(#crow)"/>
  <!-- movies -> movie_reviews -->
  <path d="M 310 490 L 260 490" class="rel-line" marker-end="url(#crow)"/>
  <!-- customers -> movie_reviews -->
  <path d="M 150 680 L 150 605" class="rel-line" marker-end="url(#crow)"/>

</svg>