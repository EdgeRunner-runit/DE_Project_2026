; =====================================================================
; BookMyShow PgBouncer Connection Pooler Configuration
; Mode: Transaction Pooling
; Authors: Team T0132
; =====================================================================

[databases]
bms = host=127.0.0.1 port=5432 dbname=bms pool_size=50 reserve_pool=10

[pgbouncer]
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

; Network settings
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; POOLING MODE: Transaction
; Perfect for microservice architectures and high-frequency stateless API endpoints.
; Connections are returned to the pool immediately upon COMMIT or ROLLBACK.
pool_mode = transaction

; Connection limits
max_client_conn = 5000       ; Supports up to 5,000 concurrent frontend connections
default_pool_size = 50       ; Shared PostgreSQL backend process connections
min_pool_size = 10          ; Pre-warmed server connections
reserve_pool_size = 15      ; Emergency connections for surge booking spikes
reserve_pool_timeout = 2.0  ; Seconds before opening reserve pool

; Timeouts and keepalives
server_idle_timeout = 60.0
client_idle_timeout = 120.0
query_timeout = 10.0        ; Kills queries hanging over 10 seconds on transactional pool
